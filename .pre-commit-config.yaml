repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        files: ^(ehds/|tests/engine/|guardian/evidence/(track3_executor|routing)\.py|guardian/api/requests_api\.py|tests/(evidence/test_track3_executor|integration/test_track3_api)\.py)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=15000"]
      - id: detect-private-key
