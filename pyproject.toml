[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehds-agentic-guardian"
version = "0.1.0"
description = "Bolt-on Mistral agentic module for EHDS Track 3: structured queries, evidence limits, deterministic purpose control."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "mistralai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: calls the Mistral EU API (skipped when MISTRAL_API_KEY or the model is missing)",
]
