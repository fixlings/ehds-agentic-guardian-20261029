[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehds-agentic-guardian"
version = "0.1.0"
description = "EHDS Track 3 health data access body: AI + rules request check, protected statistics, secure workspace."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "duckdb==1.5.6",
    "pandas==2.3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-socket==0.8.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ehds*", "server*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
