<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
  <rect width="1280" height="420" rx="24" fill="#f8fafc"/>
  <defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker></defs>
  <rect x="20" y="40" width="330" height="250" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="185" y="100" font-size="32" fill="#334155">Women with breast</text>
  <text x="185" y="140" font-size="32" fill="#334155">cancer in Austria</text>
  <text x="185" y="250" font-size="96" font-weight="700" fill="#0f172a">114</text>
  <text x="385" y="185" font-size="64" fill="#64748b">&#8722;</text>
  <rect x="420" y="40" width="330" height="250" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="585" y="100" font-size="32" fill="#334155">Same, without</text>
  <text x="585" y="140" font-size="32" fill="#334155">Burgenland</text>
  <text x="585" y="250" font-size="96" font-weight="700" fill="#0f172a">112</text>
  <line x1="762" y1="165" x2="808" y2="165" stroke="#64748b" stroke-width="5" marker-end="url(#ar)"/>
  <rect x="825" y="40" width="435" height="250" rx="20" fill="#1e3a8a"/>
  <text x="1042" y="140" font-size="60" font-weight="700" fill="#ffffff">114 &#8722; 112 = 2</text>
  <text x="1042" y="205" font-size="32" fill="#ffffff">patients in Burgenland</text>
  <text x="1042" y="245" font-size="32" fill="#ffffff">exposed</text>
  <text x="640" y="365" font-size="32" fill="#334155">Both counts are above 10. A rule-following tool releases both.</text>
</svg>
